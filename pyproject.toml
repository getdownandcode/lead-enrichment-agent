[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lead-enrichment-agent"
version = "1.0.0"
description = "Resilient, LLM-powered company lead enrichment CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "google-genai>=1.0.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "tenacity>=8.2",
  "typer>=0.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
lead-agent = "lead_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Typer's documented command signature uses Option() defaults. Broad exception
# boundaries are intentional at external-service boundaries to preserve partial output.
ignore = ["B008", "BLE001"]
